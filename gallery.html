<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Style gallery - Offline Voice Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    header{padding:28px 32px 8px}
    h1{margin:0 0 6px;font-size:26px;font-weight:600}
    header p{margin:0;color:#999;font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:28px;padding:24px 32px 48px}
    .card{background:#1a1a1a;border-radius:14px;overflow:hidden}
    .frame{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#000}
    .frame iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
    .meta{padding:14px 18px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .meta h2{margin:0 0 4px;font-size:17px;font-weight:600}
    .meta p{margin:0;color:#9a9a9a;font-size:13px;line-height:1.4}
    .meta a{flex:none;color:#fff;text-decoration:none;font-size:13px;border:1px solid #444;border-radius:999px;padding:6px 14px}
    .meta a:hover{border-color:#fff}
    .tag{display:inline-block;font-size:11px;background:#8052ff;color:#fff;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
  </style>
</head>
<body>
  <header>
    <h1>Every design so far</h1>
    <p>Live previews (models not loaded). Click "Open" to try one full screen. Oldest first.</p>
  </header>
  <div class="grid" id="grid"></div>
  <script>
    const versions = [
      ["original",        "1 · Original",              "The first plain version: dark panel, settings on the left, chat on the right."],
      ["neon-glass",      "2 · Neon glass",            "Dark glass panels, aurora background, animated orb, pipeline strip and stats."],
      ["editorial",       "3 · Editorial monochrome",  "White page and black type, sharp corners, pill buttons, liquid iridescent hero (monopo saigon)."],
      ["editorial-clean", "4 · Editorial, decluttered","Same style; sidebar with chat history, settings in a slide-over panel."],
      ["liquid",          "5 · Full-page liquid",      "The moving green-amber-red liquid fills the whole page, white-on-dark UI."],
      ["obsidian",        "6 · Obsidian + crimson",    "Pure black, huge bold type, one red button, dark glass sphere (ThoughtLab)."],
      ["obsidian-full",   "7 · Obsidian, all features","Style 6 with all 20 features: modes, tutor, quiz, export, benchmark, light/dark…"],
      ["constellation",   "8 · Constellation",         "Current world.js: black void, violet button, amber labels, particle brain (Dala)."],
    ];
    const grid = document.getElementById("grid");
    versions.forEach(([key, name, desc], i) => {
      const url = "index.html" + (key ? "?style=" + key : "");
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<div class="frame"><iframe loading="lazy" title="${name}"></iframe></div>
        <div class="meta"><div><h2>${name}${key === "constellation" ? '<span class="tag">current</span>' : ""}</h2><p>${desc}</p></div>
        <a href="${url}" target="_blank" rel="noopener">Open</a></div>`;
      grid.appendChild(card);
      const f = card.querySelector("iframe");
      // load one after another so eight live pages don't all start at once
      setTimeout(() => { f.src = url; }, i * 400);
    });
    const fit = () => document.querySelectorAll(".frame").forEach((fr) => {
      fr.querySelector("iframe").style.transform = "scale(" + fr.clientWidth / 1440 + ")";
    });
    window.addEventListener("resize", fit); fit();
  </script>
</body>
</html>
